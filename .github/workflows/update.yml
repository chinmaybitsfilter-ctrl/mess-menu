name: Update menu

on:
  schedule:
    - cron: "15 0 * * *"   # every day at 05:45 IST
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Read menu from ssms-pilani.in
        run: node scrape.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app page and PDF
        run: |
          pip install reportlab
          python build.py data/menu.json docs/index.html docs/menu.pdf

      - name: Save
        run: |
          git config user.name "mess-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "Menu update $(date -u +%F)" && git push)
